<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Relatos & Páginas</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- REUTILIZAMOS EL HEADER -->
    <header class="header-principal">
        <div class="header-top">
            <div class="brand">
                <span class="logo-icon">📚</span>
                <span class="brand-name">RELATOS & PÁGINAS</span>
            </div>
            <div class="header-actions">
                <div class="auth-links">
                    <a href="index.html">Inicio</a>
                    <span>|</span>
                    <a href="login.html">Iniciar sesión</a>
                </div>
            </div>
        </div>
    </header>

    <main class="form-container">
        <h2>Contáctanos</h2>
        <p>¿Tienes dudas con tu pedido o quieres recomendarnos un libro? Déjanos tu mensaje.</p>

        <!-- FORMULARIO DE CONTACTO -->
        <form id="contactForm" novalidate>
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez">
                <span class="error-message" id="errorNombre"></span>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                <span class="error-message" id="errorEmail"></span>
            </div>

            <div class="form-group">
                <label for="asunto">Asunto:</label>
                <select id="asunto" name="asunto">
                    <option value="">-- Selecciona una opción --</option>
                    <option value="consulta">Consulta sobre un libro</option>
                    <option value="envio">Estado de mi envío</option>
                    <option value="reclamo">Reclamo o devolución</option>
                </select>
                <span class="error-message" id="errorAsunto"></span>
            </div>

            <div class="form-group">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
                <span class="error-message" id="errorMensaje"></span>
            </div>

            <button type="submit" class="btn-submit">Enviar Mensaje</button>
        </form>
    </main>

    <!-- VINCULAMOS EL ARCHIVO JS EN LA CARPETA js/ -->
    <script src="js/main.js"></script>
</body>
</html>
