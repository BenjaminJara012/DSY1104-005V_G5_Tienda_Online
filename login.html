<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Relatos & Páginas</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header class="header-principal">
        <div class="header-top">
            <div class="brand">
                <span class="logo-icon">📚</span>
                <span class="brand-name">RELATOS & PÁGINAS</span>
            </div>
            <div class="header-actions">
                <div class="auth-links">
                    <a href="index.html">Inicio</a>
                    <span>|</span>
                    <a href="registro.html">Registrarse</a>
                </div>
            </div>
        </div>
    </header>

    <main class="form-page">
        <div class="form-card">
            <div class="form-header">
                <h2>Iniciar Sesión</h2>
                <p>Ingresa tus credenciales para acceder a tu cuenta.</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="loginEmail">Correo Electrónico</label>
                    <input type="email" id="loginEmail" placeholder="correo@ejemplo.com" required>
                    <span class="error-message" id="errorLoginEmail"></span>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                    <span class="error-message" id="errorLoginPassword"></span>
                </div>

                <button type="submit" class="btn-submit">Ingresar</button>

                <div class="form-footer-text">
                    ¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer-principal">
        <div class="footer-bottom">
            <p>&copy; 2026 Relatos & Páginas. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
