<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito - Relatos & Páginas</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header class="header-principal">
        <div class="header-top">
            <div class="brand">
                <span class="logo-icon">📚</span>
                <span class="brand-name">RELATOS & PÁGINAS</span>
            </div>
            <div class="header-actions">
                <a href="index.html" class="action-item">Volver al Catálogo ➔</a>
            </div>
        </div>
    </header>

    <main class="carrito-layout">
        <!-- Columna Izquierda: Lista de Productos -->
        <section class="carrito-main">
            <h2>Mi carrito de compras</h2>
            <div id="listaCarrito">
                <!-- Se llena dinámicamente desde js/carrito.js -->
            </div>
            <button id="btnVaciar" class="btn-vaciar">Vaciar Carrito</button>
        </section>

        <!-- Columna Derecha: Resumen de Compra -->
        <aside class="carrito-resumen">
            <div class="resumen-header">
                <span>TOTAL:</span>
                <strong id="montoTotal">$0</strong>
            </div>

            <div class="cupon-group">
                <input type="text" id="inputCupon" placeholder="Ingrese el cupón de descuento">
                <button type="button" id="btnCupon" onclick="aplicarCupon()">APLICAR</button>
            </div>

            <button class="btn-pagar" onclick="alert('¡Compra realizada con éxito!')">PAGAR</button>
        </aside>
    </main>

    <!-- Vinculación a los archivos JS externos -->
    <script src="js/main.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
