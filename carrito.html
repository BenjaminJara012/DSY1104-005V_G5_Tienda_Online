<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Carrito - Relatos & Páginas</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header class="header-principal">
        <div class="header-top">
            <div class="brand">
                <span class="logo-icon">📚</span>
                <span class="brand-name">RELATOS & PÁGINAS</span>
            </div>
            <div class="header-actions">
                <a href="index.html" class="action-item">Volver al Catálogo ➔</a>
            </div>
        </div>
    </header>

    <main class="form-container" style="max-width: 800px;">
        <h2>Tu Carrito de Compras</h2>
        <div id="listaCarrito">
            <!-- Los libros agregados mediante JS aparecerán aquí -->
        </div>
        <button id="btnVaciar" class="btn-submit" style="background-color: #d9534f; margin-top: 20px;">Vaciar Carrito</button>
    </main>

    <script>
        // Cargar y mostrar items del carrito
        const lista = document.getElementById('listaCarrito');
        let productos = JSON.parse(localStorage.getItem('carritoLibreria')) || [];

        if (productos.length === 0) {
            lista.innerHTML = '<p>Tu carrito está vacío actualmente.</p>';
        } else {
            lista.innerHTML = productos.map(item => `
                <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ccc; padding: 10px 0;">
                    <img src="${item.imagen}" width="50">
                    <strong>${item.titulo}</strong>
                    <span>${item.precio}</span>
                </div>
            `).join('');
        }

        document.getElementById('btnVaciar').addEventListener('click', () => {
            localStorage.removeItem('carritoLibreria');
            location.reload();
        });
    </script>
</body>
</html>
